name: Build profile card

on:
  schedule:
    # 04:17 UTC daily. Off the hour on purpose - GitHub queues a huge number of
    # scheduled jobs at :00 and they can be delayed by 20+ minutes.
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "*.svg"
      - "cache/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

# Never let a scheduled run and a manual run fight over the same commit.
concurrency:
  group: profile-card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cache/requirements.txt

      - name: Install dependencies
        run: pip install -r cache/requirements.txt

      - name: Render the card
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: python today.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "chore: refresh profile card"
          git push
