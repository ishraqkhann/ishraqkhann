<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="474px"
     viewBox="0 0 900 474" font-family="ConsolasFallback,Consolas,'DejaVu Sans Mono','Liberation Mono',Menlo,monospace"
     font-size="16px" fill="#24292f"
     role="img" aria-label="Notes">
<title>Notes</title>
<style><![CDATA[
    @font-face {
      font-family: 'ConsolasFallback';
      src: local('Consolas'), local('Consolas Bold');
      font-display: swap;
      size-adjust: 109%;
    }
    text, tspan { white-space: pre; }
    .k  { fill: #953800; }
    .kk { fill: #24292f; }
    .v  { fill: #0a3069; }
    .a  { fill: #1a7f37; }
    .x  { fill: #cf222e; }
    .d  { fill: #8c959f; }
    .r  { fill: #afb8c1; }
    .t  { fill: #953800; }
    .bf { fill: #1a7f37; }
    .be { fill: #d0d7de; }

    @keyframes boot { from { opacity: 0; } to { opacity: 1; } }
    .ln { animation: boot .34s ease-out backwards; }
    .px { animation: boot .3s ease-out backwards; }

    @keyframes breathe {
      0%, 100% { opacity: .88; }
      50%      { opacity: 1; }
    }
    .portrait-base {
      animation: breathe 7s ease-in-out infinite;
      fill: #24292f;
    }

    .portrait-glow {
      fill: #0969da;
      opacity: 0.28;
    }

    /* Density tiers. See DENSITY in render.py. */
    .t0 { fill-opacity: 0.22; }
    .t1 { fill-opacity: 0.5; }
    .t2 { fill-opacity: 1; }

    /* Hover: only reachable where the SVG is a live document, never in an
       img tag. See the note on this function. */
    .portrait { cursor: crosshair; }
    .portrait .hit { fill: transparent; pointer-events: all; }
    .portrait .portrait-base { transition: opacity .35s ease; }
    .portrait .portrait-glow { transition: opacity .35s ease; }
    .portrait .chroma { opacity: 0; transition: opacity .35s ease; }
    .portrait:hover .portrait-base { animation: none; opacity: 1; }
    .portrait:hover .portrait-glow { opacity: 1; }
    .portrait:hover .chroma { opacity: .5; }
    .portrait:hover .sweep-band { animation: none; }

    /* Window buttons. The close button really does close the window - see
       closed_panel() - but only where the SVG is a live document. */
    .tl { cursor: pointer; }
    .tlg { opacity: 0; transition: opacity .12s ease; }
    .lights:hover .tlg { opacity: .62; }
    #reopen { cursor: pointer; }

    /* Links. Same story as hover: live wherever the SVG is a real document,
       inert inside GitHub's img tag. */
    .lnk { cursor: pointer; }
    .lnk tspan { transition: fill .15s ease; }
    .lnk:hover tspan { fill: #0969da; text-decoration: underline; }

    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { fill: #0969da; animation: blink 1.06s steps(1) infinite; }
    ]]></style>
<defs><filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.22"/></filter></defs>
<g id="win">

<defs>
  <linearGradient id="macBar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f7f7f7"/>
    <stop offset="100%" stop-color="#e3e3e3"/>
  </linearGradient>
</defs>
<g filter="url(#drop)">
  <rect x="20" y="20" width="860" height="434" rx="12" fill="#f2f2f5"/>
  <path d="M20 32 A12 12 0 0 1 32 20 H868 A12 12 0 0 1 880 32 V56 H20 Z" fill="url(#macBar)"/>
  <path d="M20.5 32.5 A12 12 0 0 1 32.5 20.5 H867.5 A12 12 0 0 1 879.5 32.5 V56.5 H20.5 Z" fill="none"
        stroke="#ffffff" stroke-opacity="0.85"/>
  <line x1="20" y1="56" x2="880" y2="56"
        stroke="#c6c6c6"/>
  <g class="lights"><g id="btnClose" class="tl"><circle cx="40" cy="38.0" r="6" fill="#ff5f57" stroke="#e0443e" stroke-width="0.5"/><circle cx="40" cy="36.2" r="2.6" fill="#ffffff" fill-opacity=".22"/><g class="tlg" transform="translate(40,38.0)" stroke="#4a1010" stroke-width="1.3" stroke-linecap="round" fill="none"><path d="M-2.1 -2.1 L2.1 2.1 M2.1 -2.1 L-2.1 2.1"/></g><circle cx="40" cy="38.0" r="9" fill="transparent"/></g><g id="btnMin" class="tl"><circle cx="60" cy="38.0" r="6" fill="#febc2e" stroke="#d79b26" stroke-width="0.5"/><circle cx="60" cy="36.2" r="2.6" fill="#ffffff" fill-opacity=".22"/><g class="tlg" transform="translate(60,38.0)" stroke="#4a1010" stroke-width="1.3" stroke-linecap="round" fill="none"><path d="M-2.6 0 H2.6"/></g><circle cx="60" cy="38.0" r="9" fill="transparent"/></g><g id="btnZoom" class="tl"><circle cx="80" cy="38.0" r="6" fill="#28c840" stroke="#1dad2b" stroke-width="0.5"/><circle cx="80" cy="36.2" r="2.6" fill="#ffffff" fill-opacity=".22"/><g class="tlg" transform="translate(80,38.0)" stroke="#4a1010" stroke-width="1.3" stroke-linecap="round" fill="none"><path d="M0 -2.6 V2.6 M-2.6 0 H2.6"/></g><circle cx="80" cy="38.0" r="9" fill="transparent"/></g></g>
  <text x="450.0" y="42.5" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"
        font-size="13px" font-weight="600" fill="#4b4b4f"
        >Notes</text>
  <rect x="20.5" y="20.5" width="859" height="433" rx="12"
        fill="none" stroke="#d0d7de" stroke-opacity=".6"/>
</g>
<text x="64" y="110" font-size="12px" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" fill="#6e6e73" font-weight="400">2026-07-29</text>
<text x="64" y="140" font-size="24px" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" fill="#1d1d1f" font-weight="700">What I write about</text>
<line x1="64" y1="160" x2="836" y2="160" stroke="#d8d8de"/>
<circle cx="72" cy="191" r="3.5" fill="#0071e3"/>
<text x="88" y="196" font-size="15.5px" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" fill="#1d1d1f" font-weight="600">System design</text>
<text x="88" y="216" font-size="13.5px" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" fill="#6e6e73" font-weight="400">How systems earn the right to last.</text>
<circle cx="72" cy="243" r="3.5" fill="#0071e3"/>
<text x="88" y="248" font-size="15.5px" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" fill="#1d1d1f" font-weight="600">Engineering culture</text>
<text x="88" y="268" font-size="13.5px" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" fill="#6e6e73" font-weight="400">What teams reward, and what that produces.</text>
<circle cx="72" cy="295" r="3.5" fill="#0071e3"/>
<text x="88" y="300" font-size="15.5px" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" fill="#1d1d1f" font-weight="600">Psychology of building</text>
<text x="88" y="320" font-size="13.5px" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" fill="#6e6e73" font-weight="400">Why technical decisions are rarely technical.</text>
<line x1="64" y1="342" x2="836" y2="342" stroke="#d8d8de"/>
<text x="64" y="374" font-size="14.5px" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" fill="#1d1d1f" font-weight="500">If you're building systems that last — in tech, music, or</text>
<text x="64" y="396" font-size="14.5px" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" fill="#1d1d1f" font-weight="500">creative work — I'd love to connect.</text>
<set attributeName="display" to="none" begin="btnClose.click" fill="freeze"/>
<set attributeName="display" to="inline" begin="reopen.click" fill="freeze"/>
</g>
<g id="closed" display="none">
  <rect x="20" y="20" width="860" height="434" rx="12" fill="#ffffff"
        fill-opacity=".35" stroke="#8c959f" stroke-opacity=".5"
        stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="450.0" y="233.0" text-anchor="middle" font-size="15px"
        fill="#8c959f">[ closed ]</text>
  <text x="450.0" y="259.0" text-anchor="middle" font-size="13px"
        fill="#8c959f" fill-opacity=".7">click anywhere to reopen</text>
  <rect id="reopen" x="20" y="20" width="860" height="434" rx="12"
        fill="transparent"/>
  <set attributeName="display" to="inline" begin="btnClose.click" fill="freeze"/>
  <set attributeName="display" to="none" begin="reopen.click" fill="freeze"/>
</g>
</svg>
